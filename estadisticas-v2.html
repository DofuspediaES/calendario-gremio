<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estadísticas del Gremio</title><style>body{margin:0;background:#171717;color:#eee;font:14px Arial}.page{max-width:950px;margin:24px auto;padding:0 14px}.box{background:#222;border:1px solid #383838;border-radius:10px;padding:18px;margin:14px 0}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card{background:#222;border:1px solid #383838;border-radius:9px;padding:14px}.v{font-size:25px;font-weight:bold;margin-top:6px}.muted{color:#999;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:10px;align-items:center;margin:10px 0}.name{width:125px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:9px;background:#303030;border-radius:9px;flex:1;overflow:hidden}.fill{height:100%;background:#f28c28}.num{width:60px;text-align:right;font-weight:bold}.rank{width:25px;color:#f28c28;font-weight:bold}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}</style></head><body><div class="page"><div class="box"><h1>📊 Estadísticas del Gremio</h1><p class="muted">Aventuwewos del Wey Wabbit</p><a href="./" style="color:#f28c28">← Volver al calendario</a></div><div class="cards"><div class="card">📅<div id="events" class="v">—</div><span class="muted">Actividades</span></div><div class="card">👤<div id="players" class="v">—</div><span class="muted">Jugadores</span></div><div class="card">🤝<div id="joins" class="v">—</div><span class="muted">Apuntados</span></div><div class="card">✅<div id="att" class="v">—</div><span class="muted">Asistencias</span></div><div class="card">❌<div id="abs" class="v">—</div><span class="muted">Inasistencias</span></div><div class="card">📈<div id="rate" class="v">—</div><span class="muted">Asistencia</span></div></div><div class="grid"><div class="box"><h2>🔥 Ranking de asistencia</h2><div id="ranking">Cargando...</div></div><div class="box"><h2>🎯 Tipos de actividad</h2><div id="types">Cargando...</div></div></div><div class="box"><h2>🏆 Récords</h2><div id="records">Cargando...</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://nmmetzityubqbrbpibee.supabase.co','sb_publishable_o8bXQ5puE8EUgEn_c_qM6A_7OOxZIsX');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let E=[],P=[];function past(e){return new Date(e.event_date+'T23:59:59')<new Date()}function isAbsent(e,p){return e.attendance_confirmed===true&&p.attended===false}function isAttended(e,p){return !isAbsent(e,p)}function render(){const done=E.filter(past),ids=new Set(done.map(e=>e.id)),pp=P.filter(p=>ids.has(p.event_id));const attended=pp.filter(p=>isAttended(E.find(e=>e.id===p.event_id),p)),absent=pp.filter(p=>isAbsent(E.find(e=>e.id===p.event_id),p));$('events').textContent=E.length;$('players').textContent=new Set(P.map(p=>p.user_id||p.player_name)).size;$('joins').textContent=P.length;$('att').textContent=attended.length;$('abs').textContent=absent.length;$('rate').textContent=pp.length?Math.round(attended.length/pp.length*100)+'%':'0%';const r={};attended.forEach(p=>{const k=p.user_id||p.player_name;if(!r[k])r[k]={n:p.player_name||'Jugador',a:0,t:0};r[k].a++});pp.forEach(p=>{const k=p.user_id||p.player_name;if(!r[k])r[k]={n:p.player_name||'Jugador',a:0,t:0};r[k].t++});const ranking=Object.values(r).sort((a,b)=>b.a-a.a||b.t-a.t);const mx=Math.max(...ranking.map(x=>x.a),1);$('ranking').innerHTML=ranking.length?ranking.slice(0,15).map((p,i)=>'<div class="row"><b class="rank">'+(i+1)+'</b><span class="name">'+esc(p.n)+'</span><div class="bar"><div class="fill" style="width:'+(p.a/mx*100)+'%"></div></div><b class="num">'+p.a+'/'+p.t+'</b></div>').join(''):'<span class="muted">Todavía no hay participaciones.</span>';const t={};E.forEach(e=>t[e.type]=(t[e.type]||0)+1);const tl={dungeon:'🗝️ Mazmorra',quest:'🗺️ Misión',infinite_dreams:'🌀 Sueños Infinitos',commission:'📦 Encargo',raid:'⚔️ Raid',farm:'💰 Drop/Farm',wanted:'📜 Busca y Captura',other:'🎲 Otro'};const tv=Object.entries(t).sort((a,b)=>b[1]-a[1]),tm=Math.max(...tv.map(x=>x[1]),1);$('types').innerHTML=tv.map(([k,n])=>'<div class="row"><span class="name">'+esc(tl[k]||k)+'</span><div class="bar"><div class="fill" style="width:'+(n/tm*100)+'%"></div></div><b class="num">'+n+'</b></div>').join('');const busiest=E.slice().sort((a,b)=>P.filter(p=>p.event_id===b.id).length-P.filter(p=>p.event_id===a.id).length)[0];$('records').innerHTML='<p>👥 Mayor participación: <b>'+(busiest?P.filter(p=>p.event_id===busiest.id).length:0)+'</b> apuntados</p><p>✅ Asistencias: <b>'+attended.length+'</b> (incluye implícitas)</p><p>❌ Inasistencias: <b>'+absent.length+'</b></p>'}async function load(){const a=await db.from('events').select('id,name,type,event_date,event_time,capacity,attendance_confirmed');const b=await db.from('event_participants').select('event_id,user_id,player_name,attended');if(a.error||b.error){console.error(a.error,b.error);$('ranking').textContent='Error cargando estadísticas.';return}E=a.data||[];P=b.data||[];render()}load();</script></body></html>
