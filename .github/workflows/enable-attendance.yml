name: Enable attendance module

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Install attendance module'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch calendar
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('index.html').read_text(encoding='utf-8')
          if 'attendance.js' not in index:
              index = index.replace('</body>', '<script src="attendance.js"></script>\n</body>')
              Path('index.html').write_text(index, encoding='utf-8')

          app = Path('app.js').read_text(encoding='utf-8')
          marker = 'card.dataset.eventId = event.id;'
          if marker not in app:
              pattern = r'(card\.className\s*=\s*`event-card \$\{eventType\} type-\$\{eventType\}`;)'
              app, count = re.subn(pattern, r'\1\n\n        card.dataset.eventId = event.id;', app, count=1)
              if count != 1:
                  raise SystemExit('No se encontró el punto seguro para añadir eventId a las tarjetas')
              Path('app.js').write_text(app, encoding='utf-8')

      - name: Commit and remove one-time workflow
        run: |
          rm -f .github/workflows/enable-attendance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js .github/workflows/enable-attendance.yml
          git commit -m 'Install attendance module'
          git push
